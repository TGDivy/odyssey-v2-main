name: odyssey

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: odyssey
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyssey -d odyssey"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro

  storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: odyssey
      MINIO_ROOT_PASSWORD: odyssey-local-development-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-data:/data

  storage-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set odyssey http://storage:9000 odyssey odyssey-local-development-only; do sleep 1; done
        mc mb --ignore-existing odyssey/odyssey-local
        mc version enable odyssey/odyssey-local
        mc anonymous set none odyssey/odyssey-local
    depends_on:
      storage:
        condition: service_started

  migrate:
    build:
      context: ../backend
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: &backend-environment
      ODYSSEY_ENV: local
      ODYSSEY_DATABASE_URL: postgresql+asyncpg://odyssey:odyssey-local-only@postgres:5432/odyssey
      ODYSSEY_ATTACHMENT_STORE_BACKEND: s3
      ODYSSEY_STORAGE_ENDPOINT: http://storage:9000
      ODYSSEY_STORAGE_BUCKET: odyssey-local
      ODYSSEY_STORAGE_REGION: us-east-1
      ODYSSEY_STORAGE_ACCESS_KEY: odyssey
      ODYSSEY_STORAGE_SECRET_KEY: odyssey-local-development-only
      ODYSSEY_STORAGE_FORCE_PATH_STYLE: "true"
      ODYSSEY_STORAGE_REQUIRE_VERSIONING: "true"
      ODYSSEY_STORAGE_REQUIRE_PUBLIC_ACCESS_BLOCK: "false"
      ODYSSEY_MODEL_PROVIDER: deterministic
      ODYSSEY_AUTH_MODE: development
      ODYSSEY_PROACTIVE_ENABLED: "false"
      ODYSSEY_TELEMETRY_EXPORTER: console
      ODYSSEY_ATTACHMENT_STORAGE_PATH: /var/lib/odyssey/attachments
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
      storage-init:
        condition: service_completed_successfully

  api:
    build:
      context: ../backend
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - attachment-data:/var/lib/odyssey/attachments

  worker:
    build:
      context: ../backend
    command: ["uv", "run", "--no-sync", "odyssey-worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - attachment-data:/var/lib/odyssey/attachments

volumes:
  postgres-data:
  object-data:
  attachment-data:
